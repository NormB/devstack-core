# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor Docker Compose for base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for every action bump rather than one per action.
      github-actions:
        patterns:
          - "*"

  # Python - FastAPI Code-First implementation
  - package-ecosystem: "pip"
    directory: "/reference-apps/fastapi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      fastapi-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Python - FastAPI API-First implementation
  - package-ecosystem: "pip"
    directory: "/reference-apps/fastapi-api-first"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      fastapi-api-first-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Python - Shared test suite
  - package-ecosystem: "pip"
    directory: "/reference-apps/shared/test-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      test-suite-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Go - Gin implementation
  - package-ecosystem: "gomod"
    directory: "/reference-apps/golang"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      golang-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Node.js - Express implementation
  - package-ecosystem: "npm"
    directory: "/reference-apps/nodejs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      nodejs-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Rust - Actix-web implementation
  - package-ecosystem: "cargo"
    directory: "/reference-apps/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # TypeScript - API-First implementation
  - package-ecosystem: "npm"
    directory: "/reference-apps/typescript-api-first"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      typescript-api-first-minor-patch:
        update-types:
          - "minor"
          - "patch"
