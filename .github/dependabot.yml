# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Image tags in docker-compose.yml. This has to be the docker-compose
  # ecosystem: the docker ecosystem reads Dockerfiles only, and configured
  # on "/" it found none and errored on every run ("No Dockerfiles nor
  # Kubernetes YAML found in /"), which is how the compose defaults went a
  # year without a bump. It reads literal tags only: an image written as
  # `postgres:${POSTGRES_VERSION:-18}` is skipped (the 2026-09-03 run parsed
  # zero dependencies), so docker-compose.yml pins every image literally.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      docker-compose-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images of the Dockerfiles this repository builds. Same rule: a
  # `FROM image:${ARG}` is skipped, so the FROM lines carry literal tags.
  - package-ecosystem: "docker"
    directories:
      - "/configs/forgejo"
      - "/configs/pgbouncer"
      - "/configs/vector"
      - "/reference-apps/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      dockerfile-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR for every action bump rather than one per action.
      github-actions:
        patterns:
          - "*"

  # Python - FastAPI Code-First implementation
  - package-ecosystem: "pip"
    directory: "/reference-apps/fastapi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      fastapi-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # fastapi-cache2 0.2.2 (the newest release) pins redis<5.0.0 through its
      # [redis] extra. Every bump past 4.x has made requirements.txt
      # unresolvable, twice merged unnoticed while CI could not fail.
      - dependency-name: "redis"
        versions: [">=5.0.0"]

  # Python - FastAPI API-First implementation
  - package-ecosystem: "pip"
    directory: "/reference-apps/fastapi-api-first"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      fastapi-api-first-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # fastapi-cache2 0.2.2 (the newest release) pins redis<5.0.0 through its
      # [redis] extra. Every bump past 4.x has made requirements.txt
      # unresolvable, twice merged unnoticed while CI could not fail.
      - dependency-name: "redis"
        versions: [">=5.0.0"]

  # Python - Shared test suite
  - package-ecosystem: "pip"
    directory: "/reference-apps/shared/test-suite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      test-suite-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Go - Gin implementation
  - package-ecosystem: "gomod"
    directory: "/reference-apps/golang"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      golang-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Node.js - Express implementation
  - package-ecosystem: "npm"
    directory: "/reference-apps/nodejs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      nodejs-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Rust - Actix-web implementation
  - package-ecosystem: "cargo"
    directory: "/reference-apps/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut noise.
      # Majors stay individual: they are the ones worth reading.
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # TypeScript - API-First implementation
  - package-ecosystem: "npm"
    directory: "/reference-apps/typescript-api-first"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
