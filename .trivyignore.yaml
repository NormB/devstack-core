# Exceptions for the Docker image scan and the repository (fs) scan in
# .github/workflows/security.yml.
#
# The rule for the image scan: it counts CRITICAL findings that have a fix
# (--ignore-unfixed), because a finding without a fix cannot be cleared by
# updating the image.
# A fixed finding is listed here only when the newest published tag of the
# image still carries it, so this repository cannot act on it either; the
# entry names the binary, the fix it waits for, and the day that was checked.
#
# Every entry expires. When one does, the scan goes red: re-scan the newest
# tag of the image (trivy image --ignore-unfixed --severity CRITICAL <image>).
# If it is clean, bump the image in docker-compose.yml and delete the entry.
# If not, record the new check date and move expired_at forward.
#
# Re-checked 2026-10-22 with Trivy 0.74.0 (linux/amd64, the CI runner's
# platform) against postgres:18, mongo:8.3, mysql:8.0.46, mysql:8.4.13,
# mysql:9.7.4, hashicorp/vault:1.21, hashicorp/vault:2.2 and
# ghcr.io/google/cadvisor:v0.60.6. That check removed the golang.org/x/crypto
# entry (CVE-2026-56854; no image carries it any more) and the cadvisor paths:
# cadvisor moved its images to ghcr.io/google/cadvisor (v0.56.0 release
# notes); the gcr.io image stops at v0.55.1, the ghcr.io images start at
# v0.57.0, and v0.60.6 scans clean.

vulnerabilities:
  - id: CVE-2025-68121
    paths:
      - "usr/local/bin/gosu"
    statement: >-
      Go standard library, fixed in Go 1.24.13 / 1.25.7. The gosu binary that
      the official postgres, mysql and mongo images ship is built with older
      Go, in the newest tag of every one of them; the fix lands when upstream
      rebuilds gosu.
    expired_at: 2026-11-30

  # Vault: the hashicorp/vault:1.21 tag was last published 2026-03-05 and
  # carries the four entries below; hashicorp/vault:2.2 scans clean. Clearing
  # them means the major move to 2.x (see the open vault pull request).
  - id: CVE-2026-31789
    paths:
      - "hashicorp/vault:1.21 (alpine 3.23.3)"
    statement: >-
      OpenSSL libcrypto3/libssl3, fixed in Alpine 3.5.6-r0. The newest 1.21
      vault image was built before the Alpine package update.
    expired_at: 2026-11-30

  - id: CVE-2026-33815
    paths:
      - "bin/vault"
    statement: >-
      github.com/jackc/pgx/v5, fixed in 5.9.0; linked into the newest 1.21
      Vault release.
    expired_at: 2026-11-30

  - id: CVE-2026-33816
    paths:
      - "bin/vault"
    statement: >-
      github.com/jackc/pgx/v5, fixed in 5.9.0; linked into the newest 1.21
      Vault release.
    expired_at: 2026-11-30

  - id: CVE-2026-33186
    paths:
      - "bin/vault"
    statement: >-
      google.golang.org/grpc, fixed in 1.79.3; linked into the newest 1.21
      Vault release.
    expired_at: 2026-11-30

  # Checked 2026-10-22 with Trivy 0.74.0 (linux/amd64): mysql:8.0.46,
  # mysql:8.4.13 and mysql:9.7.4 all ship certifi 2026.2.25 in MySQL Shell.
  # 8.0.46 is the last 8.0 tag (published 2026-05-05); the 8.0 line gets no
  # more images, so on expiry the fix for this repository is a move to a
  # maintained line (8.4 or 9.7, see the open mysql pull request), once that
  # line's newest tag scans clean.
  - id: GHSA-6q48-6c7w-9gw2
    paths:
      - "usr/lib/mysqlsh/lib/python3.13/site-packages/certifi-2026.2.25.dist-info/METADATA"
    statement: >-
      certifi, fixed in 2026.10.19: it removes the emSign root CAs. Bundled
      with MySQL Shell in every newest mysql tag, which were built before
      that release; the fix lands when Oracle rebuilds the images.
    expired_at: 2026-11-30

  # Repository (fs) scan. This advisory has no fixed version: it marks the
  # golang.org/x/crypto/openpgp packages as unmaintained in every release of
  # the module. The Go reference app does not import them; checked
  # 2026-10-15 with `go mod why golang.org/x/crypto/openpgp` ("main module
  # does not need package"). Re-check that on expiry.
  - id: GO-2026-5932
    paths:
      - "reference-apps/golang/go.mod"
    statement: >-
      golang.org/x/crypto/openpgp is unmaintained, with no fixed release; the
      Go reference app does not import any openpgp package.
    expired_at: 2027-01-15
