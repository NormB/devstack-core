# hadolint policy. CI (lint.yml, "Dockerfile Lint") fails at warning and
# above, so every rule listed here is one the repository has decided not to
# follow, with the reason. Anything not listed is enforced.
ignored:
  # DL3018 (apk add) and DL3008 (apt-get install) want every package pinned
  # to a version. Alpine and Debian drop superseded package versions from
  # their repositories, so a pinned install breaks within weeks and the
  # pins would need constant hand maintenance; --no-cache and a pinned base
  # image are the reproducibility this project relies on instead.
  - DL3018
  - DL3008
  # DL3007 flags the alpine:latest runtime stage of the Go and Rust apps.
  # The floating tag is deliberate for a minimal runtime stage that installs
  # nothing but ca-certificates and wget. (Dependabot does watch these
  # Dockerfiles since 2026-09-03, so a pinned tag would now be bumped; the
  # choice to float is about the stage, not the tooling.)
  - DL3007
